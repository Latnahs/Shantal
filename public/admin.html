<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blush: #f9f0f4; --blush-mid: #f0e0ea; --blush-deep: #e8cedd;
      --plum: #3d1a2e; --plum-soft: #7a4d6a; --plum-faint: #b899aa;
      --lavender: #9b72aa; --lavender-pale: #e8dcf0; --lavender-dark: #6b4a7e;
      --white: #ffffff;
      --sidebar-bg: #2a0e20; --sidebar-border: rgba(155,114,170,0.18);
      --green: #2e7d52; --red: #b83c3c;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Jost', system-ui, sans-serif;
      --sidebar-w: 220px; --radius: 12px;
    }

    body { font-family: var(--sans); background: var(--blush); color: var(--plum); display: flex; min-height: 100vh; font-weight: 300; }

    /* ── LOGIN ── */
    #login-gate {
      position: fixed; inset: 0;
      background: var(--sidebar-bg);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }

    #login-gate::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 300px 300px at 20% 20%, rgba(155,114,170,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 200px 300px at 80% 80%, rgba(155,114,170,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-box {
      background: rgba(42,26,40,0.95);
      border: 1px solid var(--sidebar-border);
      border-radius: 16px;
      padding: 2.8rem 2.2rem;
      width: 360px; text-align: center; position: relative;
    }

    .login-box h1 { font-family: var(--serif); color: #fff; font-size: 1.9rem; font-weight: 300; margin-bottom: 0.3rem; }
    .login-box p  { font-size: 0.76rem; color: rgba(255,255,255,0.3); margin-bottom: 2rem; letter-spacing: 0.08em; }

    .login-box input {
      width: 100%; padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(155,114,170,0.25);
      border-radius: 9px; color: #fff;
      font-family: var(--sans); font-size: 0.9rem; font-weight: 300;
      margin-bottom: 1rem; outline: none;
      transition: border-color 0.15s;
    }

    .login-box input:focus { border-color: var(--lavender); }
    .login-box input::placeholder { color: rgba(255,255,255,0.2); }

    .login-btn {
      width: 100%; padding: 0.75rem;
      background: linear-gradient(135deg, var(--lavender), var(--lavender-dark));
      color: #fff; border: none; border-radius: 9px;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 400; letter-spacing: 0.08em;
      cursor: pointer; transition: opacity 0.15s;
    }

    .login-btn:hover { opacity: 0.88; }
    .login-error { font-size: 0.76rem; color: #e08080; margin-top: 0.75rem; min-height: 1.1em; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w); background: var(--sidebar-bg);
      position: fixed; top: 0; left: 0; bottom: 0;
      display: flex; flex-direction: column; z-index: 100;
      border-right: 1px solid var(--sidebar-border);
    }

    #sidebar::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 140px 200px at 15% 8%, rgba(155,114,170,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .sidebar-logo { padding: 1.6rem 1.3rem 1.2rem; border-bottom: 1px solid var(--sidebar-border); position: relative; }
    .sidebar-logo span { font-family: var(--serif); font-size: 1.1rem; font-weight: 300; color: #fff; letter-spacing: 0.06em; display: block; }
    .sidebar-logo p { font-size: 0.6rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(155,114,170,0.5); margin-top: 3px; }

    .sidebar-section { padding: 1.1rem 0.7rem 0.4rem; position: relative; }
    .sidebar-label { font-size: 0.58rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(155,114,170,0.45); padding: 0 0.5rem; margin-bottom: 0.35rem; }

    .s-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 0.52rem 0.7rem; border-radius: 8px;
      color: rgba(240,224,234,0.6); font-size: 0.8rem; font-weight: 300;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left;
      transition: background 0.15s, color 0.15s; font-family: var(--sans);
    }

    .s-btn:hover  { background: rgba(155,114,170,0.14); color: #fff; }
    .s-btn.active { background: rgba(155,114,170,0.2); color: var(--lavender); font-weight: 400; }
    .s-btn svg    { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.65; }
    .s-btn.active svg { opacity: 1; }

    .sidebar-footer { margin-top: auto; padding: 1rem 1.1rem; border-top: 1px solid var(--sidebar-border); }
    .back-link { font-size: 0.74rem; color: rgba(240,224,234,0.35); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color 0.15s; font-weight: 300; }
    .back-link:hover { color: rgba(155,114,170,0.8); }

    /* ── MAIN ── */
    #main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(249,240,244,0.92); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--blush-deep);
      height: 52px; display: flex; align-items: center; padding: 0 2.2rem; gap: 1rem;
    }

    .topbar h2 { font-family: var(--serif); font-size: 1rem; font-weight: 300; letter-spacing: 0.06em; }

    /* ── PANELS ── */
    .panel { display: none; padding: 2.2rem 2.5rem 4rem; }
    .panel.active { display: block; animation: fadein 0.22s ease; }
    @keyframes fadein { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    /* ── DROP ZONE ── */
    .drop-zone {
      border: 1.5px dashed var(--blush-deep);
      border-radius: var(--radius);
      padding: 3rem 2rem; text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--white); margin-bottom: 1.5rem;
    }

    .drop-zone.drag-over { border-color: var(--lavender); background: var(--lavender-pale); }
    .drop-zone svg { width: 36px; height: 36px; color: var(--plum-faint); margin-bottom: 0.7rem; }
    .drop-zone h3 { font-family: var(--serif); font-size: 1.2rem; font-weight: 300; margin-bottom: 0.3rem; }
    .drop-zone p  { font-size: 0.78rem; color: var(--plum-faint); font-weight: 300; }
    .drop-zone input[type="file"] { display: none; }

    /* ── FORM ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 0.64rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--plum-faint); }

    .form-field input,
    .form-field select,
    .form-field textarea {
      padding: 0.62rem 0.9rem;
      background: var(--white); border: 1px solid var(--blush-deep);
      border-radius: 8px; font-family: var(--sans); font-size: 0.88rem;
      color: var(--plum); outline: none; transition: border-color 0.15s; font-weight: 300;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus { border-color: var(--lavender); }
    .form-field textarea { resize: vertical; min-height: 80px; }

    /* ── QUEUE ── */
    .queue-header { font-size: 0.64rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--plum-faint); margin-bottom: 0.9rem; }

    .queue-grid { columns: 3 200px; gap: 0.9rem; margin-bottom: 1.5rem; }

    .queue-item {
      break-inside: avoid; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--blush-deep); background: var(--white);
      margin-bottom: 0.9rem; position: relative; transition: transform 0.15s;
    }

    .queue-item:hover { transform: translateY(-2px); }
    .queue-item img  { width: 100%; display: block; object-fit: cover; }
    .queue-item video { width: 100%; display: block; max-height: 160px; object-fit: cover; }

    .q-info { padding: 0.6rem 0.8rem; }
    .q-name { font-size: 0.8rem; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-size { font-size: 0.68rem; color: var(--plum-faint); margin-top: 1px; font-weight: 300; }

    .q-remove {
      position: absolute; top: 7px; right: 7px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(61,26,46,0.6); color: #fff;
      border: none; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
    }

    .queue-item:hover .q-remove { opacity: 1; }

    .q-status { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--lavender); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease; }
    .queue-item.uploading .q-status { transform: scaleX(0.6); }
    .queue-item.done      .q-status { transform: scaleX(1); background: var(--green); }
    .queue-item.error     .q-status { transform: scaleX(1); background: var(--red); }

    .pdf-thumb { aspect-ratio: 4/3; background: var(--sidebar-bg); display: flex; align-items: center; justify-content: center; }
    .pdf-thumb svg { width: 36px; height: 36px; fill: rgba(155,114,170,0.3); }

    /* ── SUBMIT ── */
    .submit-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

    .upload-btn {
      padding: 0.62rem 1.6rem;
      background: linear-gradient(135deg, var(--lavender), var(--lavender-dark));
      color: #fff; border: none; border-radius: 20px;
      font-family: var(--sans); font-size: 0.84rem; font-weight: 400;
      letter-spacing: 0.06em; cursor: pointer; transition: opacity 0.15s;
    }

    .upload-btn:hover { opacity: 0.88; }
    .upload-btn:disabled { opacity: 0.35; cursor: default; }
    .upload-status { font-size: 0.82rem; color: var(--plum-soft); font-weight: 300; }

    /* ── BLOG FORM ── */
    .blog-form { max-width: 660px; }
    .blog-form .form-field { margin-bottom: 1rem; }

    /* ── LIBRARY ── */
    .library-filter { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

    .lib-chip {
      font-size: 0.72rem; font-weight: 400; padding: 0.32rem 0.88rem;
      border-radius: 20px; border: 1px solid var(--blush-deep);
      background: var(--white); color: var(--plum-soft);
      cursor: pointer; transition: all 0.15s;
    }

    .lib-chip.active { background: var(--lavender); border-color: var(--lavender); color: #fff; }
    .lib-chip:hover:not(.active) { border-color: var(--lavender); color: var(--lavender); }

    .library-grid { columns: 3 180px; gap: 0.9rem; }

    .lib-item {
      break-inside: avoid; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--blush-deep); background: var(--white);
      margin-bottom: 0.9rem; position: relative; transition: transform 0.15s;
    }

    .lib-item:hover { transform: translateY(-2px); }
    .lib-item img { width: 100%; display: block; object-fit: cover; }

    .lib-overlay {
      position: absolute; inset: 0; background: rgba(61,26,46,0);
      display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 8px; transition: background 0.2s;
    }

    .lib-item:hover .lib-overlay { background: rgba(61,26,46,0.35); }

    .lib-del {
      opacity: 0; width: 28px; height: 28px; border-radius: 6px;
      background: var(--red); color: #fff; border: none;
      cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s;
    }

    .lib-item:hover .lib-del { opacity: 1; }
    .lib-info { padding: 0.6rem 0.85rem; }
    .lib-name { font-size: 0.78rem; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lib-meta { font-size: 0.68rem; color: var(--plum-faint); margin-top: 1px; font-weight: 300; }

    .post-list { display: flex; flex-direction: column; gap: 0.7rem; }

    .post-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.9rem 1.1rem; background: var(--white);
      border: 1px solid var(--blush-deep); border-radius: var(--radius);
    }

    .post-tag-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .post-row-title { font-size: 0.88rem; font-weight: 400; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-row-date { font-size: 0.7rem; color: var(--plum-faint); flex-shrink: 0; font-weight: 300; }
    .post-del { padding: 0.28rem 0.7rem; font-size: 0.72rem; border: 1px solid rgba(184,60,60,0.3); color: var(--red); background: none; border-radius: 6px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; font-family: var(--sans); }
    .post-del:hover { background: rgba(184,60,60,0.08); }

    .lib-empty { font-size: 0.86rem; color: var(--plum-faint); padding: 2rem 0; font-style: italic; font-family: var(--serif); }

    /* ── DASHBOARD ── */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
    .stat-card { background: var(--white); border: 1px solid var(--blush-deep); border-radius: var(--radius); padding: 1.2rem 1.3rem; }
    .stat-card.accent { background: linear-gradient(135deg, var(--lavender), var(--lavender-dark)); border-color: transparent; }
    .stat-card.accent .stat-label,
    .stat-card.accent .stat-sub { color: rgba(255,255,255,0.65); }
    .stat-card.accent .stat-value { color: #fff; }
    .stat-label { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--plum-faint); margin-bottom: 0.45rem; }
    .stat-value { font-family: var(--serif); font-size: 2.1rem; font-weight: 300; color: var(--plum); line-height: 1; }
    .stat-sub   { font-size: 0.68rem; color: var(--plum-faint); margin-top: 4px; font-weight: 300; }
    .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin-bottom: 1.4rem; }
    .dash-card { background: var(--white); border: 1px solid var(--blush-deep); border-radius: var(--radius); padding: 1.3rem 1.4rem; }
    .dash-card-title { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--plum-faint); margin-bottom: 1.2rem; }
    .bar-chart { display: flex; flex-direction: column; gap: 0.75rem; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; }
    .bar-label { font-size: 0.76rem; color: var(--plum-soft); width: 65px; flex-shrink: 0; font-weight: 300; }
    .bar-track { flex: 1; height: 6px; background: var(--blush-mid); border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
    .bar-count { font-size: 0.72rem; color: var(--plum-faint); width: 22px; text-align: right; flex-shrink: 0; }
    .heatmap-wrap { overflow-x: auto; }
    .heatmap { display: flex; gap: 3px; padding-bottom: 0.5rem; }
    .heatmap-col { display: flex; flex-direction: column; gap: 3px; }
    .heatmap-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--blush-mid); }
    .heatmap-cell[data-level="1"] { background: #e8dcf0; }
    .heatmap-cell[data-level="2"] { background: #c9a8da; }
    .heatmap-cell[data-level="3"] { background: #9b72aa; }
    .heatmap-cell[data-level="4"] { background: #6b4a7e; }
    .donut-wrap { display: flex; align-items: center; gap: 1.5rem; }
    .donut-legend { display: flex; flex-direction: column; gap: 0.5rem; }
    .legend-row { display: flex; align-items: center; gap: 0.55rem; font-size: 0.76rem; color: var(--plum-soft); font-weight: 300; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .activity-list { display: flex; flex-direction: column; }
    .activity-item { display: flex; align-items: flex-start; gap: 0.9rem; padding: 0.75rem 0; border-bottom: 1px solid var(--blush-deep); }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .activity-text { font-size: 0.8rem; color: var(--plum-soft); line-height: 1.5; font-weight: 300; }
    .activity-text strong { color: var(--plum); font-weight: 400; }
    .activity-time { font-size: 0.66rem; color: var(--plum-faint); margin-top: 1px; }
  </style>
</head>
<body>

<div id="login-gate">
  <div class="login-box">
    <h1>Admin</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Enter</button>
    <p class="login-error" id="login-err"></p>
  </div>
</div>

<nav id="sidebar">
  <div class="sidebar-logo">
    <span>Admin Panel</span>
    <p>Your personal site</p>
  </div>

  <div class="sidebar-section">
    <p class="sidebar-label">Upload</p>
    <button class="s-btn active" id="s-media"   onclick="showPanel('media')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Photos & Videos
    </button>
    <button class="s-btn" id="s-pdf" onclick="showPanel('pdf')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><polyline points="14 2 14 8 20 8"/></svg>PDFs & Files
    </button>
    <button class="s-btn" id="s-blog" onclick="showPanel('blog')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Blog Post
    </button>
  </div>

  <div class="sidebar-section">
    <p class="sidebar-label">Manage</p>
    <button class="s-btn" id="s-library"   onclick="showPanel('library')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Content Library
    </button>
    <button class="s-btn" id="s-dashboard" onclick="showPanel('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Activity Dashboard
    </button>
  </div>

  <div class="sidebar-footer">
    <a href="/index.html" class="back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to site
    </a>
  </div>
</nav>

<div id="main">
  <div class="topbar">
    <h2 id="panel-title">Upload Photos & Videos</h2>
  </div>

  <!-- MEDIA UPLOAD -->
  <div class="panel active" id="panel-media">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" multiple accept="image/*,video/*" onchange="handleFiles(this.files,'media')" />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      <h3>Drop photos & videos here</h3>
      <p>or click to browse — JPG, PNG, GIF, WEBP, MP4, MOV, WEBM</p>
    </div>
    <div class="form-grid">
      <div class="form-field">
        <label>Default caption</label>
        <input type="text" id="media-caption" placeholder="Optional caption for all" />
      </div>
      <div class="form-field">
        <label>Type override</label>
        <select id="media-type-override">
          <option value="auto">Auto-detect (recommended)</option>
          <option value="photo">Force: Photo</option>
          <option value="video">Force: Video</option>
        </select>
      </div>
    </div>
    <div id="media-queue-wrap" style="display:none">
      <p class="queue-header" id="queue-count"></p>
      <div class="queue-grid" id="media-queue"></div>
    </div>
    <div class="submit-row">
      <button class="upload-btn" id="media-upload-btn" onclick="uploadQueue('media')" disabled>Upload all</button>
      <span class="upload-status" id="media-status"></span>
    </div>
  </div>

  <!-- PDF UPLOAD -->
  <div class="panel" id="panel-pdf">
    <div class="drop-zone" id="drop-zone-pdf" onclick="document.getElementById('pdf-input').click()">
      <input type="file" id="pdf-input" multiple accept=".pdf" onchange="handleFiles(this.files,'pdf')" />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><polyline points="14 2 14 8 20 8"/></svg>
      <h3>Drop PDFs here</h3>
      <p>or click to browse — PDF files only, up to 100 MB each</p>
    </div>
    <div id="pdf-queue-wrap" style="display:none">
      <p class="queue-header" id="pdf-queue-count"></p>
      <div class="queue-grid" id="pdf-queue"></div>
    </div>
    <div class="submit-row">
      <button class="upload-btn" id="pdf-upload-btn" onclick="uploadQueue('pdf')" disabled>Upload all</button>
      <span class="upload-status" id="pdf-status"></span>
    </div>
  </div>

  <!-- BLOG POST -->
  <div class="panel" id="panel-blog">
    <div class="blog-form">
      <div class="form-field" style="margin-bottom:1rem"><label>Post title *</label><input type="text" id="post-title" placeholder="Your post title" /></div>
      <div class="form-field" style="margin-bottom:1rem"><label>Tag / Category</label>
        <select id="post-tag">
          <option value="personal">Personal</option>
          <option value="tech">Tech</option>
          <option value="creative">Creative</option>
          <option value="life">Life</option>
        </select>
      </div>
      <div class="form-field" style="margin-bottom:1rem"><label>Excerpt (shown on cards)</label><textarea id="post-excerpt" placeholder="2–3 sentence summary…"></textarea></div>
      <div class="form-field" style="margin-bottom:1.5rem"><label>Full content</label><textarea id="post-content" style="min-height:200px" placeholder="Write your full post here…"></textarea></div>
      <div class="submit-row">
        <button class="upload-btn" onclick="publishPost()">Publish post</button>
        <span class="upload-status" id="post-status"></span>
      </div>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="panel" id="panel-library">
    <div class="library-filter">
      <button class="lib-chip active" onclick="loadLibrary('all')">All</button>
      <button class="lib-chip" onclick="loadLibrary('photos')">Photos</button>
      <button class="lib-chip" onclick="loadLibrary('videos')">Videos</button>
      <button class="lib-chip" onclick="loadLibrary('files')">PDFs</button>
      <button class="lib-chip" onclick="loadLibrary('posts')">Blog Posts</button>
    </div>
    <div id="library-content"></div>
  </div>

  <!-- DASHBOARD -->
  <div class="panel" id="panel-dashboard">
    <div id="dash-content"><p style="color:var(--plum-faint);font-style:italic;font-family:var(--serif)">Loading…</p></div>
  </div>
</div>

<script>
  let adminPW = '';
  let queues  = { media: [], pdf: [] };

  async function doLogin() {
    const pw  = document.getElementById('pw-input').value.trim();
    const err = document.getElementById('login-err');
    if (!pw) return;
    const res  = await fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
    const data = await res.json();
    if (data.ok) {
      adminPW = pw;
      document.getElementById('login-gate').style.display = 'none';
    } else {
      err.textContent = 'Wrong password — try again.';
      document.getElementById('pw-input').value = '';
    }
  }

  const panelTitles = { media:'Upload Photos & Videos', pdf:'Upload PDFs & Files', blog:'New Blog Post', library:'Content Library', dashboard:'Activity Dashboard' };

  function showPanel(id) {
    ['media','pdf','blog','library','dashboard'].forEach(p => {
      document.getElementById('panel-'+p).classList.toggle('active', p===id);
      document.getElementById('s-'+p)?.classList.toggle('active', p===id);
    });
    document.getElementById('panel-title').textContent = panelTitles[id];
    if (id==='library')   loadLibrary('all');
    if (id==='dashboard') loadDashboard();
  }

  // Drag & Drop
  ['drop-zone','drop-zone-pdf'].forEach(zoneId => {
    const zone  = document.getElementById(zoneId);
    const qType = zoneId==='drop-zone' ? 'media' : 'pdf';
    zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files, qType); });
  });

  function handleFiles(files, qType) {
    Array.from(files).forEach(f => {
      if (!queues[qType].find(q=>q.file.name===f.name&&q.file.size===f.size))
        queues[qType].push({ file:f, id:Math.random().toString(36).slice(2), status:'pending' });
    });
    renderQueue(qType);
  }

  function renderQueue(qType) {
    const q       = queues[qType];
    const gridId  = qType==='media' ? 'media-queue' : 'pdf-queue';
    const wrapId  = qType==='media' ? 'media-queue-wrap' : 'pdf-queue-wrap';
    const countId = qType==='media' ? 'queue-count' : 'pdf-queue-count';
    const btnId   = qType==='media' ? 'media-upload-btn' : 'pdf-upload-btn';
    const grid    = document.getElementById(gridId);

    document.getElementById(wrapId).style.display = q.length ? 'block' : 'none';
    document.getElementById(countId).textContent  = `${q.length} file${q.length>1?'s':''} queued`;
    document.getElementById(btnId).disabled       = !q.length;

    grid.innerHTML = q.map(item => {
      const isPDF = item.file.type==='application/pdf';
      const isVid = item.file.type.startsWith('video/');
      const isImg = item.file.type.startsWith('image/');
      const src   = (isImg||isVid) ? URL.createObjectURL(item.file) : '';
      const sizeKB = (item.file.size/1024).toFixed(0);

      let preview = '';
      if (isImg) preview = `<img src="${src}" style="max-height:200px;width:100%;object-fit:cover" />`;
      else if (isVid) preview = `<video src="${src}" muted style="max-height:160px;width:100%;object-fit:cover"></video>`;
      else if (isPDF) preview = `<div class="pdf-thumb"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg></div>`;

      return `
        <div class="queue-item ${item.status}" id="qi-${item.id}">
          ${preview}
          <div class="q-info"><p class="q-name">${item.file.name}</p><p class="q-size">${sizeKB} KB</p></div>
          <button class="q-remove" onclick="removeFromQueue('${item.id}','${qType}')">✕</button>
          <div class="q-status"></div>
        </div>`;
    }).join('');
  }

  function removeFromQueue(id, qType) {
    queues[qType] = queues[qType].filter(q=>q.id!==id);
    renderQueue(qType);
  }

  async function uploadQueue(qType) {
    const q      = queues[qType];
    const btnId  = qType==='media' ? 'media-upload-btn' : 'pdf-upload-btn';
    const statId = qType==='media' ? 'media-status' : 'pdf-status';
    const caption  = document.getElementById('media-caption')?.value || '';
    const override = document.getElementById('media-type-override')?.value || 'auto';

    document.getElementById(btnId).disabled = true;
    document.getElementById(statId).textContent = 'Uploading…';

    let done = 0;
    for (const item of q) {
      const el = document.getElementById('qi-'+item.id);
      el?.classList.add('uploading');
      const fd = new FormData();
      fd.append('file', item.file);
      fd.append('title', item.file.name.replace(/\.[^.]+$/,''));
      fd.append('caption', caption);
      let type = qType==='pdf' ? 'file' : (override!=='auto' ? override : (item.file.type.startsWith('video/') ? 'video' : 'photo'));
      fd.append('type', type);

      try {
        const res = await fetch('/api/upload', { method:'POST', headers:{'x-admin-password':adminPW}, body:fd });
        if (res.ok) { el?.classList.remove('uploading'); el?.classList.add('done'); item.status='done'; done++; }
        else        { el?.classList.remove('uploading'); el?.classList.add('error'); }
      } catch {    el?.classList.remove('uploading'); el?.classList.add('error'); }
    }

    document.getElementById(statId).textContent = `✓ ${done} of ${q.length} uploaded`;
    setTimeout(() => {
      queues[qType] = queues[qType].filter(i=>i.status!=='done');
      renderQueue(qType);
      document.getElementById(statId).textContent = '';
    }, 2200);
  }

  async function publishPost() {
    const title   = document.getElementById('post-title').value.trim();
    const tag     = document.getElementById('post-tag').value;
    const excerpt = document.getElementById('post-excerpt').value.trim();
    const content = document.getElementById('post-content').value.trim();
    const stat    = document.getElementById('post-status');
    if (!title) { stat.textContent = '⚠ Title required'; return; }
    stat.textContent = 'Publishing…';
    const res = await fetch('/api/posts', { method:'POST', headers:{'Content-Type':'application/json','x-admin-password':adminPW}, body:JSON.stringify({title,tag,excerpt,content}) });
    if (res.ok) {
      stat.textContent = '✓ Published!';
      document.getElementById('post-title').value = '';
      document.getElementById('post-excerpt').value = '';
      document.getElementById('post-content').value = '';
      setTimeout(() => stat.textContent='', 2500);
    } else { stat.textContent = '✗ Error publishing'; }
  }

  async function loadLibrary(filter) {
    document.querySelectorAll('.lib-chip').forEach(c => {
      const map = { all:'all', photos:'photos', videos:'videos', files:'pdfs', posts:'blog posts' };
      c.classList.toggle('active', c.textContent.trim().toLowerCase() === (map[filter]||filter));
    });

    const res  = await fetch('/api/content');
    const db   = await res.json();
    const wrap = document.getElementById('library-content');
    const tagColors = { personal:'#c47090', tech:'#9b72aa', creative:'#4fa882', life:'#7a5abf' };

    function mediaBlock(items, type, label) {
      if (!items.length) return `<p class="lib-empty">No ${label} yet.</p>`;
      return `<div class="library-grid">${items.map(item => {
        const isVid = type==='videos', isPDF = type==='files';
        let preview = '';
        if (!isVid && !isPDF) preview = `<img src="${item.url}" style="max-height:200px" />`;
        else if (isVid) preview = `<video src="${item.url}" muted style="max-height:160px;width:100%;object-fit:cover"></video>`;
        else preview = `<div style="aspect-ratio:4/3;background:var(--sidebar-bg);display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="rgba(155,114,170,.3)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg></div>`;
        return `
          <div class="lib-item">
            ${preview}
            <div class="lib-overlay"><button class="lib-del" onclick="deleteItem('${type.replace(/s$/,'')}','${item.id}')">✕</button></div>
            <div class="lib-info"><p class="lib-name">${item.title}</p><p class="lib-meta">${new Date(item.date).toLocaleDateString()}</p></div>
          </div>`;
      }).join('')}</div>`;
    }

    let html = '';
    if (filter==='all'||filter==='photos') { html += `<p class="queue-header" style="margin-bottom:.75rem">Photos (${db.photos.length})</p>${mediaBlock(db.photos,'photos','photos')}<div style="height:2rem"></div>`; }
    if (filter==='all'||filter==='videos') { html += `<p class="queue-header" style="margin-bottom:.75rem">Videos (${db.videos.length})</p>${mediaBlock(db.videos,'videos','videos')}<div style="height:2rem"></div>`; }
    if (filter==='all'||filter==='files')  { html += `<p class="queue-header" style="margin-bottom:.75rem">PDFs (${db.files.length})</p>${mediaBlock(db.files,'files','files')}<div style="height:2rem"></div>`; }
    if (filter==='all'||filter==='posts') {
      html += `<p class="queue-header" style="margin-bottom:.75rem">Blog Posts (${db.posts.length})</p>`;
      html += !db.posts.length ? '<p class="lib-empty">No posts yet.</p>' :
        `<div class="post-list">${db.posts.map(p=>`
          <div class="post-row">
            <div class="post-tag-dot" style="background:${tagColors[p.tag]||'#b899aa'}"></div>
            <p class="post-row-title">${p.title}</p>
            <p class="post-row-date">${new Date(p.date).toLocaleDateString()}</p>
            <button class="post-del" onclick="deleteItem('post','${p.id}')">Delete</button>
          </div>`).join('')}</div>`;
    }
    wrap.innerHTML = html;
  }

  async function deleteItem(type, id) {
    if (!confirm('Delete this item?')) return;
    const res = await fetch(`/api/item/${type}/${id}`, { method:'DELETE', headers:{'x-admin-password':adminPW} });
    if (res.ok) loadLibrary('all');
  }

  async function loadDashboard() {
    const wrap = document.getElementById('dash-content');
    try {
      const res   = await fetch('/api/stats');
      const stats = await res.json();
      const { counts, thisMonth, weeklyActivity, tagBreakdown, activity } = stats;
      const max   = Math.max(counts.photos, counts.videos, counts.files, counts.posts, 1);
      const tagColors  = { personal:'#c47090', tech:'#9b72aa', creative:'#4fa882', life:'#7a5abf' };
      const typeColors = { photo:'#c47090', video:'#9b72aa', file:'#c4703a', post:'#4fa882' };

      let hmHtml = '';
      weeklyActivity.forEach(count => {
        hmHtml += '<div class="heatmap-col">';
        for (let d=0; d<7; d++) {
          const l = count===0?0:count<=1?1:count<=3?2:count<=6?3:4;
          hmHtml += `<div class="heatmap-cell" data-level="${l}"></div>`;
        }
        hmHtml += '</div>';
      });

      const totalPosts = tagBreakdown.reduce((s,t)=>s+t.count,0)||1;
      const r=35, circ=2*Math.PI*r;
      let offset=0;
      const donutArcs = tagBreakdown.filter(t=>t.count>0).map(t => {
        const frac = t.count/totalPosts;
        const dash = `${frac*circ} ${circ}`;
        const arc  = `<circle r="${r}" cx="45" cy="45" fill="none" stroke="${tagColors[t.tag]||'#b899aa'}" stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 45 45)"/>`;
        offset += frac*circ;
        return arc;
      }).join('');

      wrap.innerHTML = `
        <div class="dash-grid">
          <div class="stat-card"><p class="stat-label">Photos</p><p class="stat-value">${counts.photos}</p><p class="stat-sub">+${thisMonth.photos} this month</p></div>
          <div class="stat-card"><p class="stat-label">Videos</p><p class="stat-value">${counts.videos}</p><p class="stat-sub">+${thisMonth.videos} this month</p></div>
          <div class="stat-card"><p class="stat-label">PDFs</p><p class="stat-value">${counts.files}</p><p class="stat-sub">+${thisMonth.files} this month</p></div>
          <div class="stat-card"><p class="stat-label">Blog Posts</p><p class="stat-value">${counts.posts}</p><p class="stat-sub">+${thisMonth.posts} this month</p></div>
          <div class="stat-card accent"><p class="stat-label">Total Items</p><p class="stat-value">${counts.total}</p><p class="stat-sub">All categories</p></div>
        </div>

        <div class="dash-row">
          <div class="dash-card">
            <p class="dash-card-title">Uploads by category</p>
            <div class="bar-chart">
              ${[['Photos',counts.photos,'#c47090'],['Videos',counts.videos,'#9b72aa'],['PDFs',counts.files,'#c4703a'],['Blog',counts.posts,'#4fa882']].map(([l,c,col])=>`
                <div class="bar-row">
                  <span class="bar-label">${l}</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/max*100)}%;background:${col}"></div></div>
                  <span class="bar-count">${c}</span>
                </div>`).join('')}
            </div>
          </div>
          <div class="dash-card">
            <p class="dash-card-title">Blog posts by tag</p>
            <div class="donut-wrap">
              <svg width="90" height="90" viewBox="0 0 90 90">
                <circle r="35" cx="45" cy="45" fill="none" stroke="var(--blush-mid)" stroke-width="16"/>
                ${donutArcs||''}
              </svg>
              <div class="donut-legend">
                ${tagBreakdown.map(t=>`<div class="legend-row"><span class="legend-dot" style="background:${tagColors[t.tag]}"></span>${t.tag} — ${t.count}</div>`).join('')}
              </div>
            </div>
          </div>
        </div>

        <div class="dash-card" style="margin-bottom:1.4rem">
          <p class="dash-card-title">Upload activity — last 16 weeks</p>
          <div class="heatmap-wrap"><div class="heatmap">${hmHtml}</div></div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:10px">
            <span style="font-size:.62rem;color:var(--plum-faint)">Less</span>
            ${[0,1,2,3,4].map(l=>`<div class="heatmap-cell" data-level="${l}"></div>`).join('')}
            <span style="font-size:.62rem;color:var(--plum-faint)">More</span>
          </div>
        </div>

        <div class="dash-card">
          <p class="dash-card-title">Recent activity</p>
          <div class="activity-list">
            ${!activity.length ? '<p style="font-size:.82rem;color:var(--plum-faint);padding:.5rem 0;font-style:italic;font-family:var(--serif)">Nothing yet.</p>' :
              activity.map(a=>`
                <div class="activity-item">
                  <div class="activity-dot" style="background:${typeColors[a.type]||'#b899aa'}"></div>
                  <div>
                    <p class="activity-text">Added <strong>${a.label}</strong>${a.tag?' · '+a.tag:''}</p>
                    <p class="activity-time">${new Date(a.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</p>
                  </div>
                </div>`).join('')}
          </div>
        </div>`;
    } catch(e) {
      wrap.innerHTML = '<p style="color:var(--plum-faint);font-style:italic">Could not load stats.</p>';
    }
  }
</script>
</body>
</html>
